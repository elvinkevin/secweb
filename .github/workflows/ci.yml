name: Flask Docker Compose CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Sets up the advanced Buildx engine required for caching Docker layers
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the application image locally using Docker Bake
      - name: Build Application Image
        uses: docker/bake-action@v6
        with:
          load: true
          set: |
            *.cache-from=type=local,src=/tmp/.buildx-cache
            *.cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Builds/starts the full compose stack (db + web) with secrets injected
      - name: Run Tests via Docker Compose
        env:
          FLASK_DEBUG: false  # Flask 3.x deprecated FLASK_ENV; this is the current equivalent
          SECRET_KEY: ${{ secrets.CI_FLASK_SECRET_KEY }}
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: secweb
          BCRYPT_LOG_ROUNDS: 4  # Drastically speeds up test performance
        run: |
          docker compose run --rm web pytest --cov=. --cov-report=term-missing

      # Upgrades the cache house-keeping so it doesn't grow indefinitely
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # --- ARTIFACT DELIVERY STAGE ---
      # Automatically authenticates with your Docker Hub credentials
      - name: Log in to Docker Hub
        if: success() && github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compiles the final production layer and pushes it to Docker Hub
      - name: Build and Push Artifact to Docker Hub
        if: success() && github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/secweb:latest
            ${{ env.DOCKERHUB_USERNAME }}/secweb:${{ github.sha }}
