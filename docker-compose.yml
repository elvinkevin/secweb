services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only_password} 
      POSTGRES_DB: ${DB_NAME:-secweb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-secweb}"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: python-alpine-app
    restart: always
    ports:
      - "8000:8000" 
    environment:
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-secweb}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-local_dev_only_password}
      - SECRET_KEY=${SECRET_KEY:-local_dev_only_key}

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
